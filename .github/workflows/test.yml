name: Quibble and Phan

on:
  workflow_call:

permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        mediawiki-version:
          - REL1_46
          - master
        stage:
          - phan
          - coverage
          - phpunit
          - phpunit-standalone
          - npm-test
          - composer-test
        exclude:
          # composer-test does not depend on the MediaWiki version
          - mediawiki-version: master
            stage: composer-test
          # coverage tooling (generatePHPUnitConfig.php) lives only on master, so
          # the action skips it on other branches; don't spin up a no-op job.
          - mediawiki-version: REL1_46
            stage: coverage

    runs-on: ubuntu-latest
    # Only these REL1_46 legs have to pass; the others still report
    continue-on-error: >-
      ${{ !(matrix.mediawiki-version == 'REL1_46'
        && contains(fromJSON('["phan", "phpunit", "npm-test", "composer-test"]'), matrix.stage)) }}

    # contents: read to clone; id-token: write so the Codecov upload can
    # authenticate via OIDC instead of an upload token.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: femiwiki/quibble-action@2b5f2466dec6f421394630fd653445da1f86b11c # v3.0.0
        id: quibble
        with:
          stage: ${{ matrix.stage }}
          mediawiki-version: ${{ matrix.mediawiki-version }}

      - name: Upload coverage to Codecov
        if: matrix.stage == 'coverage'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          directory: ${{ steps.quibble.outputs.coverage }}
